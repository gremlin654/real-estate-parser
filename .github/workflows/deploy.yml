name: Deploy to GitHub Pages

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  pages: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cd frontend && npm ci

      - name: Build main site
        run: |
          cd frontend
          VITE_BASE_URL=/real-estate-parser/ VITE_API_URL=https://real-estate-parser.onrender.com npm run build
          mkdir -p ../out/main
          cp -r dist/* ../out/main/

      - name: Build Telegram WebApp
        run: |
          cd frontend
          rm -rf dist
          VITE_BASE_URL=/real-estate-parser/telegram-webapp/ VITE_API_URL=https://real-estate-parser.onrender.com npm run build
          mkdir -p ../out/telegram-webapp
          cp -r dist/* ../out/telegram-webapp/

      - name: Add Telegram SDK to WebApp
        run: |
          cd ../out/telegram-webapp
          sed -i 's|<meta name="viewport" content="width=device-width, initial-scale=1.0" />|<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />|' index.html
          sed -i 's|<title>|<script src="https://telegram.org/js/telegram-web-app.js"></script>\n    <title>|' index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4